<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gorilla Alarm 🦍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --banana: #f9d923;
      --banana-dark: #e6c400;
      --banana-glow: rgba(249, 217, 35, 0.35);
      --gorilla: #2a1a0e;
      --gorilla-mid: #3d2512;
      --jungle-dark: #0d1a0f;
      --jungle-mid: #152218;
      --jungle-green: #1e3a20;
      --leaf: #2d5a2e;
      --text: #fef9e7;
      --text-dim: rgba(254, 249, 231, 0.5);
      --glass: rgba(255, 245, 180, 0.06);
      --glass-border: rgba(249, 217, 35, 0.15);
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--jungle-dark);
      color: var(--text);
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── jungle background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(45, 90, 46, 0.4) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(30, 58, 32, 0.5) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(13, 26, 15, 1) 0%, #060d07 100%);
      pointer-events: none;
    }

    .leaf { position: fixed; pointer-events: none; z-index: 0; font-size: 60px; opacity: 0.12; animation: sway 6s ease-in-out infinite alternate; }
    .leaf:nth-child(1) { top: -10px; left: -10px; font-size: 120px; animation-duration: 7s; }
    .leaf:nth-child(2) { top: -10px; right: -20px; font-size: 100px; transform: scaleX(-1); animation-duration: 9s; animation-delay: -3s; }
    .leaf:nth-child(3) { bottom: 0; left: 10px; font-size: 90px; animation-duration: 8s; animation-delay: -1s; }
    .leaf:nth-child(4) { bottom: 20px; right: 0; font-size: 80px; transform: scaleX(-1) rotate(20deg); animation-duration: 6s; animation-delay: -5s; }
    .leaf:nth-child(5) { top: 40%; left: -20px; font-size: 70px; animation-duration: 10s; animation-delay: -2s; }

    @keyframes sway {
      from { transform: rotate(-4deg) scale(1); }
      to   { transform: rotate(4deg) scale(1.04); }
    }

    /* floating bananas */
    .float-banana {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      font-size: 28px;
      opacity: 0.18;
      animation: float-up 15s linear infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      5%   { opacity: 0.18; }
      95%  { opacity: 0.18; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      gap: 20px;
    }

    /* ── gorilla header ── */
    .gorilla-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .gorilla-face {
      font-size: 80px;
      line-height: 1;
      transition: filter 0.5s;
      cursor: default;
      user-select: none;
      animation: gorilla-idle 4s ease-in-out infinite;
    }
    @keyframes gorilla-idle {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%       { transform: translateY(-6px) rotate(1deg); }
    }
    .gorilla-face.alert {
      animation: gorilla-alert 0.4s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 16px rgba(249,217,35,0.6));
    }
    @keyframes gorilla-alert {
      from { transform: rotate(-6deg) scale(1); }
      to   { transform: rotate(6deg) scale(1.08); }
    }
    .gorilla-face.sleeping {
      animation: gorilla-sleep 3s ease-in-out infinite;
      filter: brightness(0.7);
    }
    @keyframes gorilla-sleep {
      0%, 100% { transform: rotate(-3deg); }
      50%       { transform: rotate(3deg); }
    }

    .gorilla-title {
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      color: var(--banana);
      text-shadow: 0 2px 12px var(--banana-glow), 0 0 40px rgba(249,217,35,0.2);
      letter-spacing: 0.05em;
    }

    .gorilla-mood {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-height: 18px;
      transition: color 0.4s;
    }
    .gorilla-mood.active { color: #86efac; }
    .gorilla-mood.ringing { color: #fca5a5; animation: pulse-text 0.6s ease-in-out infinite; }
    @keyframes pulse-text { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* ── clock card ── */
    .clock-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 28px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,245,180,0.03) inset;
    }

    #clock {
      font-family: 'Fredoka One', cursive;
      font-size: 68px;
      letter-spacing: 0.04em;
      color: var(--banana);
      text-shadow: 0 0 30px var(--banana-glow), 0 2px 0 rgba(0,0,0,0.4);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #date {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    /* ── add alarm card ── */
    .add-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 28px 32px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      color: var(--banana);
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    #new-alarm-time {
      flex: 0 0 auto;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(249,217,35,0.2);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      text-align: center;
      padding: 10px 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-variant-numeric: tabular-nums;
      width: 150px;
    }
    #new-alarm-time:focus {
      border-color: var(--banana);
      box-shadow: 0 0 0 3px var(--banana-glow);
    }
    #new-alarm-time::-webkit-calendar-picker-indicator {
      filter: invert(0.8) sepia(1) saturate(3) hue-rotate(5deg);
      cursor: pointer;
      opacity: 0.6;
    }

    #new-alarm-label {
      flex: 1;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(249,217,35,0.15);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #new-alarm-label::placeholder { color: var(--text-dim); }
    #new-alarm-label:focus {
      border-color: rgba(249,217,35,0.5);
      box-shadow: 0 0 0 3px var(--banana-glow);
    }

    #add-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      letter-spacing: 0.06em;
      cursor: pointer;
      background: linear-gradient(135deg, var(--banana), #f0a500);
      color: var(--gorilla);
      box-shadow: 0 4px 20px var(--banana-glow);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #add-btn:hover { box-shadow: 0 6px 28px rgba(249,217,35,0.55); }
    #add-btn:active { transform: scale(0.97); }

    /* ── alarm list ── */
    .alarm-list-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alarm-item {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      transition: border-color 0.3s, box-shadow 0.3s;
      animation: slide-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .alarm-item.active-alarm {
      border-color: rgba(134, 239, 172, 0.4);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), 0 0 20px rgba(134,239,172,0.1);
    }
    .alarm-item.ringing-alarm {
      border-color: rgba(249,217,35,0.6);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), 0 0 30px rgba(249,217,35,0.2);
      animation: ring-pulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes ring-pulse {
      from { box-shadow: 0 4px 20px rgba(0,0,0,0.35), 0 0 20px rgba(249,217,35,0.2); }
      to   { box-shadow: 0 4px 20px rgba(0,0,0,0.35), 0 0 40px rgba(249,217,35,0.45); }
    }

    .alarm-banana { font-size: 28px; flex-shrink: 0; }

    .alarm-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .alarm-time-display {
      font-family: 'Fredoka One', cursive;
      font-size: 26px;
      color: var(--text);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .alarm-label-display {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .alarm-toggle {
      position: relative;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .alarm-toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      background: rgba(200,200,200,0.7);
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .alarm-toggle input:checked + .toggle-track {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-color: rgba(74,222,128,0.3);
    }
    .alarm-toggle input:checked + .toggle-track::after {
      transform: translateX(20px);
      background: #fff;
    }

    .alarm-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      opacity: 0.35;
      transition: opacity 0.2s, transform 0.2s;
      padding: 4px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .alarm-delete:hover { opacity: 0.8; transform: scale(1.15); }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .empty-state .empty-icon { font-size: 36px; opacity: 0.4; }

    /* ── ringing overlay ── */
    .ring-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(5, 10, 5, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      align-items: center;
      justify-content: center;
    }
    .ring-overlay.show {
      display: flex;
      animation: overlay-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes overlay-in {
      from { opacity:0; transform:scale(0.88); }
      to   { opacity:1; transform:scale(1); }
    }

    /* ripples */
    .ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(249,217,35,0.3); animation: ripple-out 2.2s ease-out infinite; }
    .ripple:nth-child(2) { animation-delay: 0.7s; }
    .ripple:nth-child(3) { animation-delay: 1.4s; }
    @keyframes ripple-out {
      from { width:100px; height:100px; opacity:0.8; }
      to   { width:600px; height:600px; opacity:0; }
    }

    .ring-box {
      position: relative;
      background: rgba(20, 12, 5, 0.9);
      border: 1px solid rgba(249,217,35,0.3);
      border-radius: 36px;
      padding: 52px 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 0 80px rgba(249,217,35,0.15), 0 24px 64px rgba(0,0,0,0.7);
      z-index: 1;
      min-width: 320px;
    }

    .ring-gorilla { font-size: 80px; animation: ring-gorilla 0.35s ease-in-out infinite; }
    @keyframes ring-gorilla {
      0%,100% { transform: rotate(-10deg) scale(1); }
      50%      { transform: rotate(10deg) scale(1.1); }
    }

    .ring-title {
      font-family: 'Fredoka One', cursive;
      font-size: 36px;
      color: var(--banana);
      text-shadow: 0 0 30px var(--banana-glow);
    }

    .ring-alarm-name {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }
    .ring-alarm-time-big {
      font-family: 'Fredoka One', cursive;
      font-size: 48px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .snooze-count {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      min-height: 18px;
    }

    .ring-btns {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    #snooze-btn {
      flex: 1;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(249,217,35,0.25);
      background: rgba(249,217,35,0.08);
      color: var(--banana);
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.05em;
    }
    #snooze-btn:hover { background: rgba(249,217,35,0.15); }
    #snooze-btn:active { transform: scale(0.97); }

    #dismiss-btn {
      flex: 1;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--banana), #f0a500);
      color: var(--gorilla);
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--banana-glow);
      transition: box-shadow 0.2s, transform 0.15s;
      letter-spacing: 0.05em;
    }
    #dismiss-btn:hover { box-shadow: 0 6px 28px rgba(249,217,35,0.55); }
    #dismiss-btn:active { transform: scale(0.97); }

    /* ── snooze badge ── */
    .snooze-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(249,217,35,0.12);
      border: 1px solid rgba(249,217,35,0.25);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--banana);
      font-weight: 500;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<div class="bg"></div>
<!-- leaves -->
<div class="leaf">🌿</div>
<div class="leaf">🌿</div>
<div class="leaf">🌿</div>
<div class="leaf">🌿</div>
<div class="leaf">🌿</div>

<div class="page">

  <!-- gorilla header -->
  <div class="gorilla-header">
    <div class="gorilla-face" id="gorilla-face">🦍</div>
    <div class="gorilla-title">Gorilla Alarm</div>
    <div class="gorilla-mood" id="gorilla-mood">ゆっくり休んでるべ…</div>
  </div>

  <!-- clock -->
  <div class="clock-card">
    <div id="clock">00:00:00</div>
    <div id="date">---- . -- . -- (−)</div>
  </div>

  <!-- add alarm -->
  <div class="add-card">
    <div class="section-title">🍌 アラームを追加</div>
    <div class="input-row">
      <input type="time" id="new-alarm-time" value="07:00" />
      <input type="text" id="new-alarm-label" placeholder="ラベル（例: 朝ごはん）" maxlength="20" />
    </div>
    <button id="add-btn">🦍 追加するべ！</button>
  </div>

  <!-- alarm list -->
  <div class="alarm-list-card" id="alarm-list">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🍌</div>
      <div>まだアラームがないべ<br>上から追加してけれ！</div>
    </div>
  </div>

</div>

<!-- ringing overlay -->
<div class="ring-overlay" id="ring-overlay">
  <div class="ripple"></div>
  <div class="ripple"></div>
  <div class="ripple"></div>
  <div class="ring-box">
    <div class="ring-gorilla">🦍</div>
    <div class="ring-title">起きるべ！！</div>
    <div class="ring-alarm-name" id="ring-alarm-name">アラーム</div>
    <div class="ring-alarm-time-big" id="ring-alarm-time-big">00:00</div>
    <div class="snooze-count" id="snooze-count"></div>
    <div class="ring-btns">
      <button id="snooze-btn">🍌 5分スヌーズ</button>
      <button id="dismiss-btn">✅ 止めるべ</button>
    </div>
  </div>
</div>

<script>
  /* ── floating bananas ── */
  for (let i = 0; i < 8; i++) {
    const b = document.createElement('div');
    b.className = 'float-banana';
    b.textContent = '🍌';
    b.style.left = `${Math.random() * 100}vw`;
    b.style.fontSize = `${18 + Math.random() * 22}px`;
    b.style.animationDelay = `${Math.random() * -15}s`;
    b.style.animationDuration = `${12 + Math.random() * 10}s`;
    document.querySelector('.bg').appendChild(b);
  }

  /* ── state ── */
  const DAYS = ['日','月','火','水','木','金','土'];
  let alarms = JSON.parse(localStorage.getItem('gorilla-alarms') || '[]');
  let ringingId = null;
  let snoozeCount = 0;
  let audioCtx = null;
  let ringingInterval = null;

  const clockEl      = document.getElementById('clock');
  const dateEl       = document.getElementById('date');
  const gorillaFace  = document.getElementById('gorilla-face');
  const gorillaMood  = document.getElementById('gorilla-mood');
  const alarmList    = document.getElementById('alarm-list');
  const emptyState   = document.getElementById('empty-state');
  const ringOverlay  = document.getElementById('ring-overlay');
  const ringAlarmName= document.getElementById('ring-alarm-name');
  const ringTimeBig  = document.getElementById('ring-alarm-time-big');
  const snoozeCountEl= document.getElementById('snooze-count');
  const snoozeBtn    = document.getElementById('snooze-btn');
  const dismissBtn   = document.getElementById('dismiss-btn');
  const addBtn       = document.getElementById('add-btn');
  const newTimeInput = document.getElementById('new-alarm-time');
  const newLabelInput= document.getElementById('new-alarm-label');

  function pad(n) { return String(n).padStart(2, '0'); }
  function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  function saveAlarms() {
    localStorage.setItem('gorilla-alarms', JSON.stringify(alarms));
  }

  /* ── tick ── */
  function tick() {
    const now = new Date();
    const hh = pad(now.getHours()), mm = pad(now.getMinutes()), ss = pad(now.getSeconds());
    clockEl.textContent = `${hh}:${mm}:${ss}`;
    dateEl.textContent  = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${DAYS[now.getDay()]})`;

    if (ringingId === null) {
      alarms.forEach(a => {
        if (!a.enabled) return;
        const [ah, am] = a.time.split(':').map(Number);
        if (now.getHours() === ah && now.getMinutes() === am && now.getSeconds() === 0 && !a.snoozedUntil) {
          triggerAlarm(a.id);
        }
        if (a.snoozedUntil) {
          const su = new Date(a.snoozedUntil);
          if (now >= su) {
            a.snoozedUntil = null;
            saveAlarms();
            triggerAlarm(a.id);
          }
        }
      });
    }

    updateGorillaState();
  }

  setInterval(tick, 1000);
  tick();

  /* ── gorilla state ── */
  function updateGorillaState() {
    const activeCount = alarms.filter(a => a.enabled).length;
    if (ringingId) {
      gorillaFace.className = 'gorilla-face alert';
      gorillaMood.textContent = '🔔 起きるべ！！';
      gorillaMood.className = 'gorilla-mood ringing';
    } else if (activeCount > 0) {
      gorillaFace.className = 'gorilla-face';
      gorillaMood.textContent = `👀 ${activeCount}個のアラームを見張ってるべ`;
      gorillaMood.className = 'gorilla-mood active';
    } else {
      gorillaFace.className = 'gorilla-face sleeping';
      gorillaMood.textContent = 'ゆっくり休んでるべ…';
      gorillaMood.className = 'gorilla-mood';
    }
  }

  /* ── render list ── */
  function renderList() {
    const items = alarmList.querySelectorAll('.alarm-item');
    items.forEach(el => el.remove());

    if (alarms.length === 0) {
      emptyState.style.display = 'flex';
      return;
    }
    emptyState.style.display = 'none';

    alarms.forEach(a => {
      const div = document.createElement('div');
      div.className = 'alarm-item' +
        (a.id === ringingId ? ' ringing-alarm' : a.enabled ? ' active-alarm' : '');
      div.dataset.id = a.id;

      const snoozeHtml = a.snoozedUntil
        ? `<span class="snooze-badge">🍌 スヌーズ中</span>`
        : '';

      div.innerHTML = `
        <div class="alarm-banana">${a.enabled ? '🍌' : '🫙'}</div>
        <div class="alarm-info">
          <div class="alarm-time-display">${a.time}</div>
          <div class="alarm-label-display">${a.label || 'ラベルなし'} ${snoozeHtml}</div>
        </div>
        <label class="alarm-toggle">
          <input type="checkbox" ${a.enabled ? 'checked' : ''} />
          <span class="toggle-track"></span>
        </label>
        <button class="alarm-delete" title="削除">🗑️</button>
      `;

      div.querySelector('input[type=checkbox]').addEventListener('change', e => {
        const alarm = alarms.find(x => x.id === a.id);
        if (alarm) { alarm.enabled = e.target.checked; alarm.snoozedUntil = null; saveAlarms(); renderList(); updateGorillaState(); }
      });
      div.querySelector('.alarm-delete').addEventListener('click', () => {
        alarms = alarms.filter(x => x.id !== a.id);
        saveAlarms(); renderList(); updateGorillaState();
      });

      alarmList.appendChild(div);
    });
  }

  /* ── add alarm ── */
  addBtn.addEventListener('click', () => {
    const time = newTimeInput.value;
    if (!time) return;
    alarms.push({ id: uid(), time, label: newLabelInput.value.trim(), enabled: true, snoozedUntil: null });
    alarms.sort((a, b) => a.time.localeCompare(b.time));
    saveAlarms();
    newLabelInput.value = '';
    renderList();
    updateGorillaState();

    addBtn.textContent = '🍌 追加したべ！';
    setTimeout(() => { addBtn.innerHTML = '🦍 追加するべ！'; }, 1200);
  });

  /* ── audio ── */
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playChime() {
    const ctx = getCtx();
    const t = ctx.currentTime;
    [[523,0],[659,0.18],[784,0.36],[1047,0.54],[784,0.72],[659,0.9]].forEach(([f,d]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, t+d);
      gain.gain.linearRampToValueAtTime(0.22, t+d+0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t+d+0.55);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t+d); osc.stop(t+d+0.6);
    });
  }

  function startRinging() { playChime(); ringingInterval = setInterval(playChime, 2200); }
  function stopRinging()  { clearInterval(ringingInterval); ringingInterval = null; }

  /* ── trigger / dismiss / snooze ── */
  function triggerAlarm(id) {
    ringingId = id;
    snoozeCount = 0;
    const alarm = alarms.find(a => a.id === id);
    ringAlarmName.textContent = alarm?.label || 'アラーム';
    ringTimeBig.textContent   = alarm?.time || '';
    snoozeCountEl.textContent = '';
    ringOverlay.classList.add('show');
    startRinging();
    updateGorillaState();
    renderList();
  }

  dismissBtn.addEventListener('click', () => {
    stopRinging();
    ringOverlay.classList.remove('show');
    ringingId = null;
    snoozeCount = 0;
    renderList();
    updateGorillaState();
  });

  snoozeBtn.addEventListener('click', () => {
    stopRinging();
    ringOverlay.classList.remove('show');
    if (ringingId) {
      const alarm = alarms.find(a => a.id === ringingId);
      if (alarm) {
        snoozeCount++;
        alarm.snoozedUntil = new Date(Date.now() + 5 * 60 * 1000).toISOString();
        saveAlarms();
      }
    }
    const sc = snoozeCount;
    ringingId = null;
    snoozeCountEl.textContent = sc > 0 ? `🍌 スヌーズ ${sc}回目だべ…` : '';
    renderList();
    updateGorillaState();
  });

  /* ── init ── */
  renderList();
  updateGorillaState();
</script>
</body>
</html>
