<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ring Alarm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #7c6dfa;
      --accent-glow: rgba(124, 109, 250, 0.4);
      --accent-2: #f06dba;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f0f0ff;
      --text-secondary: rgba(200, 200, 240, 0.55);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060612;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ── animated gradient blobs ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #5b4aff, transparent 70%);
      top: -120px; left: -100px;
      animation-duration: 14s;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #f06dba, transparent 70%);
      bottom: -80px; right: -80px;
      animation-duration: 10s;
      animation-delay: -4s;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #23c4f8, transparent 70%);
      top: 40%; left: 55%;
      opacity: 0.2;
      animation-duration: 16s;
      animation-delay: -7s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* ── particles ── */
    canvas#stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 400px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 52px 52px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0,0,0,0.55),
        0 0 80px rgba(92,74,255,0.1);
    }

    /* ── header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bell-icon {
      font-size: 15px;
      opacity: 0.6;
    }
    h1 {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* ── clock ring ── */
    .clock-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clock-svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 3;
    }
    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    .clock-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #clock {
      font-size: 52px;
      font-weight: 200;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 40px rgba(124, 109, 250, 0.5);
    }
    #date {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    /* ── divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    }

    /* ── alarm section ── */
    .alarm-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .alarm-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .time-input-wrap {
      position: relative;
    }
    #alarm-time {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 36px;
      font-weight: 200;
      text-align: center;
      padding: 14px 0;
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s;
      font-variant-numeric: tabular-nums;
    }
    #alarm-time:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), 0 0 24px var(--accent-glow);
    }
    #alarm-time::-webkit-calendar-picker-indicator {
      filter: invert(0.5) brightness(1.4);
      cursor: pointer;
      opacity: 0.5;
    }

    /* ── toggle button ── */
    #toggle-btn {
      width: 100%;
      padding: 17px;
      border-radius: 16px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    #toggle-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.2s;
    }
    #toggle-btn:hover::before { opacity: 1; }
    #toggle-btn:active { transform: scale(0.97); }

    #toggle-btn.set {
      background: linear-gradient(135deg, #6c5ce7, #a855f7);
      color: #fff;
      box-shadow: 0 4px 24px rgba(108, 92, 231, 0.45);
    }
    #toggle-btn.set:hover {
      box-shadow: 0 6px 32px rgba(108, 92, 231, 0.65);
    }
    #toggle-btn.cancel {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(200, 200, 240, 0.7);
    }

    /* ── status ── */
    #status {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      min-height: 18px;
      text-align: center;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }
    #status.active {
      color: #6ee7b7;
    }
    #status.ringing {
      color: #f87171;
      animation: pulse-text 0.7s ease-in-out infinite;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── ring overlay ── */
    .ring-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .ring-overlay.show {
      display: flex;
      animation: overlay-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes overlay-in {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .ring-box {
      background: rgba(15, 10, 35, 0.85);
      border: 1px solid rgba(240, 109, 186, 0.3);
      border-radius: 32px;
      padding: 56px 64px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      box-shadow:
        0 0 60px rgba(240, 109, 186, 0.2),
        0 24px 64px rgba(0,0,0,0.6);
    }

    .ring-icon {
      font-size: 64px;
      animation: ring-shake 0.45s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(240, 109, 186, 0.8));
    }
    @keyframes ring-shake {
      0%, 100% { transform: rotate(-12deg) scale(1); }
      50%       { transform: rotate(12deg) scale(1.05); }
    }

    .ring-box h2 {
      font-size: 32px;
      font-weight: 200;
      color: var(--text-primary);
      letter-spacing: 0.04em;
    }
    .ring-box p {
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    #dismiss-btn {
      background: linear-gradient(135deg, #e0365a, #f06dba);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 16px 48px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(224, 54, 90, 0.45);
      letter-spacing: 0.06em;
    }
    #dismiss-btn:hover {
      box-shadow: 0 6px 32px rgba(224, 54, 90, 0.65);
    }
    #dismiss-btn:active { transform: scale(0.97); }

    /* ── ripple circles behind ring-box ── */
    .ripple-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(240, 109, 186, 0.25);
      animation: ripple-out 2s ease-out infinite;
    }
    .ripple-ring:nth-child(2) { animation-delay: 0.6s; }
    .ripple-ring:nth-child(3) { animation-delay: 1.2s; }
    @keyframes ripple-out {
      from { width: 160px; height: 160px; opacity: 0.6; }
      to   { width: 500px; height: 500px; opacity: 0; }
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<canvas id="stars"></canvas>

<div class="card">
  <div class="header">
    <span class="bell-icon">🔔</span>
    <h1>Ring Alarm</h1>
  </div>

  <div class="clock-wrap">
    <svg class="clock-svg" viewBox="0 0 220 220">
      <defs>
        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#7c6dfa"/>
          <stop offset="100%" stop-color="#f06dba"/>
        </linearGradient>
      </defs>
      <circle class="ring-track" cx="110" cy="110" r="100" />
      <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="100"
        stroke-dasharray="628.3"
        stroke-dashoffset="628.3"
      />
    </svg>
    <div class="clock-inner">
      <div id="clock">00:00:00</div>
      <div id="date">--- - --</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="alarm-section">
    <span class="alarm-label">アラーム時刻</span>
    <input type="time" id="alarm-time" value="07:00" />
  </div>

  <button id="toggle-btn" class="set">アラームをセット</button>
  <div id="status">アラームはオフです</div>
</div>

<div class="ring-overlay" id="ring-overlay">
  <div class="ripple-ring"></div>
  <div class="ripple-ring"></div>
  <div class="ripple-ring"></div>
  <div class="ring-box">
    <div class="ring-icon">🔔</div>
    <h2>アラーム！</h2>
    <p id="ring-time-label"></p>
    <button id="dismiss-btn">止める</button>
  </div>
</div>

<script>
  /* ── stars canvas ── */
  (function () {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function initStars() {
      stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random(),
        da: (Math.random() - 0.5) * 0.006,
      }));
    }
    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.a = Math.max(0.05, Math.min(0.9, s.a + s.da));
        if (s.a <= 0.05 || s.a >= 0.9) s.da *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 200, 255, ${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    resize();
    initStars();
    drawStars();
    window.addEventListener('resize', () => { resize(); initStars(); });
  })();

  /* ── alarm logic ── */
  const clockEl      = document.getElementById('clock');
  const dateEl       = document.getElementById('date');
  const alarmInput   = document.getElementById('alarm-time');
  const toggleBtn    = document.getElementById('toggle-btn');
  const statusEl     = document.getElementById('status');
  const ringOverlay  = document.getElementById('ring-overlay');
  const ringTimeLabel= document.getElementById('ring-time-label');
  const dismissBtn   = document.getElementById('dismiss-btn');
  const ringProgress = document.getElementById('ring-progress');

  const CIRCUMFERENCE = 628.3;
  const DAYS = ['日', '月', '火', '水', '木', '金', '土'];

  let alarmSet = false, alarmTarget = null, audioCtx = null;
  let ringingInterval = null, alreadyFired = false;

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateRing() {
    if (!alarmSet || !alarmTarget) {
      ringProgress.style.strokeDashoffset = CIRCUMFERENCE;
      return;
    }
    const now = new Date();
    const [ah, am] = alarmTarget.split(':').map(Number);
    const alarmMs = new Date(now);
    alarmMs.setHours(ah, am, 0, 0);
    if (alarmMs <= now) alarmMs.setDate(alarmMs.getDate() + 1);
    const totalMs = 24 * 60 * 60 * 1000;
    const remaining = alarmMs - now;
    const fraction = 1 - (remaining / totalMs);
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
  }

  function tick() {
    const now = new Date();
    const hh = pad(now.getHours());
    const mm = pad(now.getMinutes());
    const ss = pad(now.getSeconds());
    clockEl.textContent = `${hh}:${mm}:${ss}`;

    const y = now.getFullYear();
    const mo = pad(now.getMonth() + 1);
    const d  = pad(now.getDate());
    const day = DAYS[now.getDay()];
    dateEl.textContent = `${y}.${mo}.${d} (${day})`;

    updateRing();

    if (alarmSet && alarmTarget && !alreadyFired) {
      const [ah, am] = alarmTarget.split(':').map(Number);
      if (now.getHours() === ah && now.getMinutes() === am && now.getSeconds() === 0) {
        triggerAlarm();
      }
    }
  }

  setInterval(tick, 1000);
  tick();

  /* ── audio ── */
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playChime() {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    [[880, 0], [1100, 0.22], [880, 0.44], [1320, 0.66]].forEach(([freq, delay]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + delay);
      gain.gain.linearRampToValueAtTime(0.28, t + delay + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t + delay);
      osc.stop(t + delay + 0.55);
    });
  }

  function startRingSound() {
    playChime();
    ringingInterval = setInterval(playChime, 1400);
  }

  function stopRingSound() {
    clearInterval(ringingInterval);
    ringingInterval = null;
  }

  /* ── alarm state ── */
  function triggerAlarm() {
    alreadyFired = true;
    ringTimeLabel.textContent = `設定時刻  ${alarmTarget}`;
    ringOverlay.classList.add('show');
    statusEl.textContent = 'アラーム鳴動中！';
    statusEl.className = 'ringing';
    startRingSound();
  }

  function dismissAlarm() {
    stopRingSound();
    ringOverlay.classList.remove('show');
    alarmSet = false;
    alreadyFired = false;
    alarmTarget = null;
    toggleBtn.textContent = 'アラームをセット';
    toggleBtn.className = 'set';
    statusEl.textContent = 'アラームはオフです';
    statusEl.className = '';
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE;
  }

  toggleBtn.addEventListener('click', () => {
    if (!alarmSet) {
      alarmTarget = alarmInput.value;
      if (!alarmTarget) return;
      alarmSet = true;
      alreadyFired = false;
      toggleBtn.textContent = 'キャンセル';
      toggleBtn.className = 'cancel';
      statusEl.textContent = `${alarmTarget} にセット済み`;
      statusEl.className = 'active';
      updateRing();
    } else {
      dismissAlarm();
    }
  });

  dismissBtn.addEventListener('click', dismissAlarm);
</script>
</body>
</html>
